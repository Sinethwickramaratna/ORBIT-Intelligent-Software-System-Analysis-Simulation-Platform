spring:
  application:
    name: backend
  config:
    # Local per-machine settings (JWT_SECRET, DB_USERNAME, DB_PASSWORD, ...) live in the repo-root .env
    import: "optional:file:${ORBIT_ENV_FILE:../.env}[.properties]"
  # No spring.datasource.*: the connection pool is created by DatabaseProvisioner after the user has entered the
  # database credentials in the first-run setup screen.
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    database: postgresql
    hibernate:
      ddl-auto: none            # Flyway owns the schema
    properties:
      # Hibernate must not touch the database while the application boots (it may not exist yet).
      hibernate.boot.allow_jdbc_metadata_access: false
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

orbit:
  env-file: ${ORBIT_ENV_FILE:../.env}
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  database:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5433}
    name: ${DB_NAME:orbit}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    url: ${DB_URL:}
  projects:
    # Docker only: the host folder that is mounted into the container, as the user writes it (E:/Projects), and its
    # mount point inside the container. Leave both empty when the backend runs directly on the user's computer.
    host-root: ${ORBIT_PROJECTS_HOST_ROOT:}
    # Docker with several drives/folders: "host|container,host|container" (see docker-compose.yml / ORBIT_MOUNT_n)
    mounts: ${ORBIT_PROJECTS_MOUNTS:}
    container-root: ${ORBIT_PROJECTS_CONTAINER_ROOT:}
  scan:
    # Folders skipped by the language scan wherever they appear: dependencies and build output are not the project's
    # own source code and would distort the language percentages. Setting this list replaces the defaults.
    ignored-folders: node_modules,.git,target,build,dist,venv,__pycache__,.venv,.next,.gradle,.orbit,.dart_tool
    # Files above this size (minified/generated bundles) are left out of the scan
    max-file-bytes: 2097152
  dependencies:
    # Dependency Check / Setup Dependencies. In Docker the user's operating system is read from the project location
    # (E:\... = Windows, /Users/... = macOS, otherwise Linux); set these when that guess is wrong (windows|mac|linux, x64|arm64).
    host-os: ${ORBIT_HOST_OS:}
    host-arch: ${ORBIT_HOST_ARCH:}
    # Python version assumed for a project that has no virtual environment (.venv) yet
    python-version: ${ORBIT_PYTHON_VERSION:3.12}
    parallel-downloads: 8
    max-download-mb: 512
    # also count packages in the user's own caches (~/.m2, ~/.gradle, ~/.nuget, pub cache) as installed
    user-caches: true
  jwt:
    # Created by the user in the first-run setup screen and stored as JWT_SECRET in .env
    secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-hours: 24

logging:
  level:
    root: INFO
    com.orbit: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
