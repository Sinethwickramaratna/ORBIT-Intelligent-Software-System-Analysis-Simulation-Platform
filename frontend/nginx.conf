server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2 text/plain;

    # Next.js fingerprints everything under /_next/static, so it can be cached forever.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
