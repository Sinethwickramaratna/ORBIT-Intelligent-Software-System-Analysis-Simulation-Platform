name: CI

# Runs on every commit that lands on main (direct push or merged PR) and can be started by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on main cancels the run for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"   # matches <java.version> in backend/pom.xml
  NODE_VERSION: "22"   # matches node:22-alpine in frontend/Dockerfile

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # 1. Preflight: are all the components the build needs actually present and usable?
  # ---------------------------------------------------------------------------------------------------------------
  preflight:
    name: Check required components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Required project files exist
        shell: bash
        run: |
          missing=0
          for f in \
            backend/pom.xml backend/Dockerfile backend/src/main/java backend/src/test/java \
            backend/src/test/resources/application-test.yaml \
            frontend/package.json frontend/package-lock.json frontend/tsconfig.json \
            frontend/next.config.ts frontend/Dockerfile frontend/nginx.conf \
            infrastructure/postgresql/Dockerfile \
            docker-compose.yml .env.example; do
            if [ -e "$f" ]; then echo "ok       $f"; else echo "MISSING  $f"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Required tools are installed
        shell: bash
        run: |
          set -e
          java -version
          mvn -version
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Docker Compose file is valid
        run: |
          cp .env.example .env
          docker compose config -q
          echo "docker-compose.yml is valid"

      - name: Maven dependencies resolve
        working-directory: backend
        run: mvn -B -ntp dependency:resolve

      - name: npm lockfile is in sync with package.json
        working-directory: frontend
        run: npm ci --dry-run

  # ---------------------------------------------------------------------------------------------------------------
  # 2. Backend: compile + unit/integration tests (H2 in-memory DB, no Docker or PostgreSQL needed)
  # ---------------------------------------------------------------------------------------------------------------
  backend:
    name: Backend tests
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Confirm tests really ran
        shell: bash
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/TEST-*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No surefire test reports were produced - tests did not run"; exit 1
          fi
          tests=$(cat "${reports[@]}" | grep -o '<testcase ' | wc -l)
          echo "Executed $tests test cases from ${#reports[@]} test classes"
          if [ "$tests" -eq 0 ]; then
            echo "::error::Zero test cases executed"; exit 1
          fi

      - name: Packaged jar exists
        run: test -f target/orbit-backend.jar && ls -l target/orbit-backend.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------------------------
  # 3. Frontend: type-check + production (static export) build
  # ---------------------------------------------------------------------------------------------------------------
  frontend:
    name: Frontend typecheck & build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Static export was produced
        run: test -f out/index.html && echo "out/index.html present"
